[pytest]
markers =
    integration: marks tests that require a live LLM (requires GPU + valid HF token)
    requires_gpu: marks tests that require a CUDA-capable GPU
    requires_checkpoints: marks tests that require CheXbert/RadGraph checkpoints
    requires_crimson_env: marks tests that require the 'crimson' conda environment
testpaths = tests
addopts = -v --tb=short
