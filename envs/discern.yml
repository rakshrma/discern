name: discern
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip
  - pip:
    # LLM API clients
    - openai>=1.0.0
    - anthropic>=0.25.0

    # Data / config
    - pydantic>=2.0.0
    - PyYAML>=6.0
    - pandas>=1.5.0
    - numpy>=1.23.0
    - scipy>=1.10.0
    - tqdm>=4.60.0

    # NLP metrics
    - nltk>=3.8.0
    - rouge>=1.0.0
    - bert-score>=0.3.13
    - evaluate>=0.4.0

    # Radiology-specific (RadGraph requires checkpoint — see config.yaml)
    - radgraph

    # Install DISCERN package:
    # pip install -e /path/to/discern
