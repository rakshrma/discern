name: discern
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip
  - pip:
    # ── Core DISCERN pipeline ───────────────────────────────────────────────
    - pandas>=1.5.0
    - pydantic>=2.0.0
    - PyYAML>=6.0
    - openai>=1.0.0
    - anthropic>=0.25.0
    - torch>=2.0.0
    - transformers>=4.40.0
    - accelerate>=0.27.0

    # ── NLP metrics ─────────────────────────────────────────────────────────
    - numpy>=1.23.0
    - scipy>=1.10.0
    - nltk>=3.8.0
    - rouge>=1.0.0
    - bert-score>=0.3.13
    - RaTEScore                       # pip install RaTEScore

    # ── Radiology-specific metrics ───────────────────────────────────────────
    - radgraph                        # pip install radgraph (needs radgraph_path checkpoint)
    # green_score: install from source (not on PyPI)
    # pip install git+https://github.com/Stanford-AIMI/GREEN.git

    # ── Utilities ────────────────────────────────────────────────────────────
    - tqdm>=4.60.0
    - matplotlib>=3.6.0
    - seaborn>=0.12.0
    - scikit-learn>=1.1.0
    - openpyxl>=3.0.0

    # ── Install DISCERN package itself ───────────────────────────────────────
    # Run from repo root: pip install -e .
