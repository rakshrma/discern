name: vllm
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip
  - pip:
    # Core dependencies (same as discern.yml)
    - openai>=1.0.0
    - anthropic>=0.25.0
    - pydantic>=2.0.0
    - PyYAML>=6.0
    - pandas>=1.5.0
    - numpy>=1.23.0
    - tqdm>=4.60.0

    # GPU inference — vllm>=0.18.0 required for Gemma 4 (31B-it) support
    - torch>=2.1.0
    - transformers>=4.40.0
    - accelerate>=0.27.0
    - vllm>=0.18.0

    # Install DISCERN package:
    # pip install -e /path/to/discern
